# Runs on every pull request into main. Checks formatting, validates, and
# posts the Terraform plan on the PR so the change can be reviewed before merge.
# No path filter on purpose: "plan" is a required check, and a required check
# that never runs would block README-only pull requests from merging.
name: terraform-plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # lets the job comment the plan on the PR

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.5"
  TF_IN_AUTOMATION: "true"
  TF_VAR_github_repo: ${{ github.repository }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Configure AWS credentials (CI user keys from GitHub secrets)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: infra
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform validate
        working-directory: infra
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: infra
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt

      - name: Comment the plan on the pull request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const max = 60000;
            let plan = fs.readFileSync('infra/plan.txt', 'utf8');
            if (plan.length > max) {
              plan = '...(truncated, see the job log for the full plan)...\n' + plan.slice(-max);
            }
            const summary = plan.match(/Plan: .*|No changes\..*/);
            const body = [
              '### Terraform plan',
              `**${summary ? summary[0] : 'See details below'}**`,
              '',
              '<details><summary>Show full plan</summary>',
              '',
              '```text',
              plan,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
