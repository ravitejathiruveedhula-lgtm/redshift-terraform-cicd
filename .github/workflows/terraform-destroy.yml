# Manual only. Deletes the Redshift stack so it stops costing money.
# Run it from the Actions tab and type "destroy" to confirm.
name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete the Redshift stack'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-main
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.5"
  TF_IN_AUTOMATION: "true"
  TF_VAR_github_repo: ${{ github.repository }}

jobs:
  destroy:
    name: destroy
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (CI user keys from GitHub secrets)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: infra
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform destroy
        working-directory: infra
        run: terraform destroy -input=false -no-color -lock-timeout=5m -auto-approve
